[project]
name = "swarmsprint"
version = "0.1.0"
description = "Two LLM agent swarms racing on one leaderboard"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pre-commit>=4.2.0",
    "mypy>=1.15.0",
    "ruff>=0.11.0",
    "pip-audit>=2.9.0",
]

[tool.mypy]
python_version = "3.13"
exclude = ["^runs/"]  # agents' archived files
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unreachable = true

[tool.ruff]
line-length = 120
extend-exclude = ["src/swarmsprint/scoring/funsearch_bin_packing.py"]  # copied verbatim from DeepMind FunSearch
force-exclude = true
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"

[[tool.mypy.overrides]]
module = "swarmsprint.scoring.funsearch_bin_packing"  # copied verbatim from DeepMind; its hints are not valid typing
ignore_errors = true
